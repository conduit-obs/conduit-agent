# 11-prometheus-scrape — curated Prometheus scrape surface.
#
# Proves: metrics.prometheus.scrape_configs renders the prometheus
# receiver (one static job per entry, defaulted interval/path/scheme)
# and wires it onto the metrics pipeline. profile.mode: none +
# metrics.red.enabled: false keep the rest of the render minimal so the
# diff isolates the Prometheus wiring.
service_name: prometheus-demo
deployment_environment: production
profile:
  mode: none
metrics:
  red:
    enabled: false
  prometheus:
    scrape_configs:
      - job_name: node-exporter
        targets: ["localhost:9100"]
      - job_name: app
        targets: ["10.0.0.5:8080", "10.0.0.6:8080"]
        scrape_interval: 15s
        metrics_path: /actuator/prometheus
        scheme: http
output:
  mode: honeycomb
  honeycomb:
    api_key: ${env:HONEYCOMB_API_KEY}
