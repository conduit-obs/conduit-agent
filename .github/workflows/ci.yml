name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Reusable composite step: clone the OBI source, generate its eBPF Go
  # bindings, and write a gitignored go.work that adds ./third_party/obi
  # to the workspace. Required by every Linux job because
  # internal/collector/components_obi_linux.go imports OBI unconditionally
  # on Linux (ADR-0020 sub-decision 1) and the upstream proxy v0.8.0
  # doesn't ship the pre-generated BPF Go bindings (ADR-0020 "Open
  # question: build pipeline"). Skipped on macOS / Windows runners
  # because the //go:build linux tag excludes the OBI import there.
  # Workspace mode (instead of `go mod edit -replace`) keeps committed
  # go.mod / go.sum byte-identical to HEAD so goreleaser's dirty-state
  # gate is happy at release time.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vendor OBI (Linux-only)
        run: make obi-vendor
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vendor OBI (Linux-only)
        if: runner.os == 'Linux'
        # macOS / Windows runners skip OBI vendoring entirely. The
        # //go:build linux tag on components_obi_linux.go excludes
        # the import on those OSes; the upstream proxy v0.8.0
        # (which lacks BPF bindings) is sufficient to satisfy
        # `go mod download` since no Go file actually compiles
        # against the OBI module on macOS / Windows.
        run: make obi-vendor
      - name: go test
        run: go test ./...

  build:
    # Cross-compile every published GOOS/GOARCH on one cheap Linux runner so a
    # Windows / darwin / arm break is caught in seconds, before the (slower,
    # native) integration-smoke matrix below pays to spin up real runners.
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, obi: true }
          - { goos: linux,   goarch: arm64, obi: true }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vendor OBI (Linux targets only)
        # Linux binaries link OBI unconditionally (ADR-0020); the bindings +
        # go.work must exist before the cross-compile. darwin / windows targets
        # exclude the OBI import via the //go:build linux tag.
        if: matrix.obi
        run: make obi-vendor
      - name: Compile
        # A plain compile gate — version ldflags are exercised by the release
        # build and `make build`, not needed to catch a broken cross-compile.
        run: |
          out="bin/conduit"
          [ "${{ matrix.goos }}" = "windows" ] && out="bin/conduit.exe"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "$out" ./
      - name: Boot smoke (linux/amd64 only)
        # The native target can actually run here: assert the binary boots,
        # reports a version, and fails loud on a missing default config.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set +e
          ./bin/conduit run; rc=$?
          if [ $rc -eq 0 ]; then echo "expected non-zero exit when default config is missing"; exit 1; fi
          ./bin/conduit doctor -c /nonexistent/conduit.yaml; rc=$?
          if [ $rc -eq 0 ]; then echo "expected non-zero exit from doctor against a missing config"; exit 1; fi
          ./bin/conduit version
          ./bin/conduit --help

  integration-smoke:
    # The per-OS/arch artifact smoke (binary boots + real OTLP roundtrip) on
    # native runners. Required for merge. The heavy install-lifecycle suite
    # (tier=full) runs nightly and as a release gate, not on every PR.
    name: Integration (smoke)
    uses: ./.github/workflows/integration.yml
    with:
      tier: smoke
    permissions:
      contents: read

  goldens:
    name: Renderer goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vendor OBI (Linux-only)
        run: make obi-vendor
      - name: Verify expander goldens are up to date
        # The harness diffs every testdata/goldens/<case>/expected.yaml
        # against a fresh render. Failure means a renderer change
        # landed without `make update-goldens`. Fix locally with
        # `make update-goldens` and commit the regenerated files.
        run: go test ./internal/expander -run TestExpand_Goldens -count=1

  doctor-anchors:
    name: Doctor docs anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vendor OBI (Linux-only)
        run: make obi-vendor
      - name: Verify every CDT code has a docs section
        # Catches "added a check but forgot the troubleshooting doc"
        # before it ships. See docs/troubleshooting/cdt-codes.md.
        run: go test ./internal/doctor -run TestDocsAnchor -count=1

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vendor OBI (Linux-only)
        run: make obi-vendor
      - name: govulncheck
        # Per [07-testing-and-conformance-plan.md] §M12 release gates,
        # govulncheck is release-blocking on HIGH/CRITICAL findings.
        # The PR-level run surfaces every finding (HIGH and below) so
        # operators see the trend; release-blocking happens in
        # release.yml when the tag is cut.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
